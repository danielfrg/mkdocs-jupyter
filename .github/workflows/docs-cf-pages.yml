name: deploy-cf-pages

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_TOKEN:
        required: true
jobs:
  prod:

    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore built website
        uses: actions/cache@v4
        with:
          path: demo/dist
          key: >
            website
            ${{ github.run_id }}
            ${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Ensure production Pages project exists
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.request

          project = "mkdocs-jupyter-danielfrg-com"
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          headers = {
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
              "Content-Type": "application/json",
          }
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          try:
              with urllib.request.urlopen(urllib.request.Request(f"{base}/{project}", headers=headers), timeout=30) as response:
                  assert json.load(response)["success"], "Pages project lookup failed"
              print("Pages project already exists")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              payload = json.dumps({"name": project, "production_branch": "main"}).encode()
              request = urllib.request.Request(base, data=payload, headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert json.load(response)["success"], "Pages project creation failed"
              print("Created production Pages project")
          PYTHON

      - name: Publish to Cloudflare Pages
        if: github.event_name == 'pull_request' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        id: cloudflare-pages-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy demo/dist --project-name=mkdocs-jupyter-danielfrg-com --branch="${{ github.head_ref || github.ref_name }}"
          packageManager: npm

      - name: Comment deploy url
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-id: cloudflare-deploy
          message: |
            ### <span aria-hidden="true">✅</span> Preview deployment
            |  Name | Link |
            |---------------------------------|------------------------|
            | Deploy Preview Url | [${{ steps.cloudflare-pages-deploy.outputs.deployment-url }}](${{ steps.cloudflare-pages-deploy.outputs.deployment-url }}) |
            | Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Latest commit | ${{ github.sha }} |
            | Environment | ${{ steps.cloudflare-pages-deploy.outputs.pages-environment }} |
