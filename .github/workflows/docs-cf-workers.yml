name: deploy-cf-workers

on:
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_TOKEN:
        required: true

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore built website
        uses: actions/cache@v4
        with:
          path: demo/dist
          key: >
            website
            ${{ github.run_id }}
            ${{ github.run_attempt }}
          fail-on-cache-miss: true

      - name: Publish to Cloudflare Workers (main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        id: cloudflare-worker-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm

      - name: Upload Worker preview (PR)
        if: github.event_name == 'pull_request'
        id: cloudflare-worker-preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias=pr-${{ github.event.pull_request.number }}
          packageManager: npm

      - name: Comment deploy url
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message-id: cloudflare-deploy
          message: |
            ### Preview deployment
            | Name | Link |
            |------|------|
            | Deploy Preview URL | [${{ steps.cloudflare-worker-preview.outputs.deployment-url }}](${{ steps.cloudflare-worker-preview.outputs.deployment-url }}) |
            | Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Latest commit | ${{ github.sha }} |
